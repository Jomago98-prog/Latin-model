<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario Prona Sur</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background-color: #ffffff; }
    .container { display: flex; min-height: 100vh; }
    aside { width: 220px; background-color: #2e7d32; color: white; padding: 20px; box-sizing: border-box; }
    aside nav a { display: block; color: white; padding: 12px; text-decoration: none; border-radius: 4px; margin-bottom: 10px; }
    aside nav a:hover, aside nav a.active { background-color: #27642b; }
    main { flex: 1; padding: 20px; background-color: #ffffff; box-sizing: border-box; }
    header h2 { margin-top: 0; color: #2e7d32; }
    button { background-color: #66bb6a; color: white; border: none; padding: 8px 16px; margin: 4px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #57a05b; }
    input, select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; margin: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background-color: white; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #a5d6a7; }
    .hidden { display: none; }
    .toolbar { margin-bottom: 12px; }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      aside { width: 100%; display: flex; overflow-x: auto; }
      aside nav { display: flex; flex-wrap: wrap; }
      aside nav a { flex: 1 1 auto; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside>
      <nav>
        <a class="nav-link active" data-section="inventario">Inventario</a>
        <a class="nav-link" data-section="rutas">Rutas</a>
        <a class="nav-link" data-section="ventas">Ventas</a>
      </nav>
    </aside>
    <main>
      <section id="inventarioSection">
        <header><h2>Inventario</h2></header>
        <div class="toolbar">
          <button id="btnAgregar">➕ Agregar</button>
          <button id="btnModificar">✏️ Modificar</button>
          <button id="btnEliminar">🗑️ Eliminar</button>
        </div>
        <div id="inventarioForm"></div>
        <div>
          <input type="text" id="searchInput" placeholder="Buscar producto...">
          <div>Total referencias: <span id="totalRefs">0</span> | Costo total: $<span id="totalCost">0</span></div>
        </div>
        <table id="inventarioTable"></table>
      </section>
      <section id="rutasSection" class="hidden">
        <header><h2>Rutas</h2></header>
        <div>
          <label>Selecciona Ruta:</label>
          <select id="rutaSelect"></select>
          <label>Producto:</label>
          <select id="productoRutaSelect"></select>
          <label>Cantidad:</label>
          <input type="number" id="cantidadRutaInput" min="1">
          <button id="asignarRutaBtn">Asignar a Ruta</button>
        </div>
        <table id="rutasTable"></table>
      </section>
      <section id="ventasSection" class="hidden">
        <header><h2>Ventas</h2></header>
        <table id="ventasTable"></table>
      </section>
    </main>
  </div>
  <script>
let productos = JSON.parse(localStorage.getItem("productos")) || [];
let rutas = JSON.parse(localStorage.getItem("rutas")) || [
  {nombre:"Ruta 1", salidas:[]},
  {nombre:"Ruta 2", salidas:[]},
  {nombre:"Ruta 3", salidas:[]},
  {nombre:"Ruta 4", salidas:[]},
  {nombre:"Ruta 5", salidas:[]}
];
let ventas = JSON.parse(localStorage.getItem("ventas")) || [];

function guardarEstado() {
  localStorage.setItem("productos", JSON.stringify(productos));
  localStorage.setItem("rutas", JSON.stringify(rutas));
  localStorage.setItem("ventas", JSON.stringify(ventas));
}

document.querySelectorAll('.nav-link').forEach(link => {
  link.addEventListener('click', () => {
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    document.querySelectorAll('main section').forEach(sec => sec.classList.add('hidden'));
    document.getElementById(link.dataset.section + 'Section').classList.remove('hidden');
    if(link.dataset.section==="inventario") renderInventario();
    if(link.dataset.section==="rutas") renderRutas();
    if(link.dataset.section==="ventas") renderVentas();
  });
});

document.getElementById("searchInput").addEventListener("input", renderInventario);

document.getElementById("btnAgregar").addEventListener("click", () => {
  renderFormInventario('agregar');
});
document.getElementById("btnModificar").addEventListener("click", () => {
  renderFormInventario('modificar');
});
document.getElementById("btnEliminar").addEventListener("click", () => {
  renderFormInventario('eliminar');
});

function renderFormInventario(accion) {
  const formDiv = document.getElementById("inventarioForm");
  if (accion === "agregar") {
    formDiv.innerHTML = `
      <h3>Agregar Producto</h3>
      <input placeholder="Nombre" id="nuevoNombre">
      <input type="number" placeholder="Costo" id="nuevoCosto">
      <input type="number" placeholder="Precio" id="nuevoPrecio">
      <input type="number" placeholder="Cantidad" id="nuevaCantidad">
      <input type="number" placeholder="Ganancia" id="nuevaGanancia">
      <button id="guardarNuevoBtn">Guardar</button>`;
    document.getElementById("guardarNuevoBtn").addEventListener("click", () => {
      productos.push({
        nombre: document.getElementById("nuevoNombre").value,
        costo: parseInt(document.getElementById("nuevoCosto").value),
        precio: parseInt(document.getElementById("nuevoPrecio").value),
        cantidad: parseInt(document.getElementById("nuevaCantidad").value),
        ganancia: parseInt(document.getElementById("nuevaGanancia").value),
        enRutas: 0
      });
      guardarEstado();
      formDiv.innerHTML = "";
      renderInventario();
      alert("Producto agregado!");
    });
  } else if (accion === "modificar") {
    formDiv.innerHTML = `
      <h3>Modificar Producto</h3>
      <select id="modificarSelect">
        ${productos.map((p,i) => `<option value="${i}">${p.nombre}</option>`).join('')}
      </select>
      <button id="editarBtn">Editar</button>`;
    document.getElementById("editarBtn").addEventListener("click", () => {
      const idx = document.getElementById("modificarSelect").value;
      renderEditarProducto(idx);
    });
  } else if (accion === "eliminar") {
    formDiv.innerHTML = `
      <h3>Eliminar Producto</h3>
      <select id="eliminarSelect">
        ${productos.map((p,i) => `<option value="${i}">${p.nombre}</option>`).join('')}
      </select>
      <button id="eliminarBtn">Eliminar</button>`;
    document.getElementById("eliminarBtn").addEventListener("click", () => {
      const idx = document.getElementById("eliminarSelect").value;
      if(confirm("¿Seguro de eliminar este producto?")) {
        productos.splice(idx,1);
        guardarEstado();
        formDiv.innerHTML = "";
        renderInventario();
      }
    });
  }
}

function renderEditarProducto(idx) {
  const p = productos[idx];
  const formDiv = document.getElementById("inventarioForm");
  formDiv.innerHTML = `
    <h3>Editar Producto: ${p.nombre}</h3>
    <input id="editNombre" value="${p.nombre}">
    <input type="number" id="editCosto" value="${p.costo}">
    <input type="number" id="editPrecio" value="${p.precio}">
    <input type="number" id="editCantidad" value="${p.cantidad}">
    <input type="number" id="editGanancia" value="${p.ganancia}">
    <button id="guardarEditBtn">Guardar Cambios</button>`;
  document.getElementById("guardarEditBtn").addEventListener("click", () => {
    p.nombre = document.getElementById("editNombre").value;
    p.costo = parseInt(document.getElementById("editCosto").value);
    p.precio = parseInt(document.getElementById("editPrecio").value);
    p.cantidad = parseInt(document.getElementById("editCantidad").value);
    p.ganancia = parseInt(document.getElementById("editGanancia").value);
    guardarEstado();
    formDiv.innerHTML = "";
    renderInventario();
    alert("Producto modificado!");
  });
}

function renderInventario() {
  const filtro = document.getElementById("searchInput").value.toLowerCase();
  const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(filtro));
  document.getElementById("totalRefs").textContent = filtrados.length;
  document.getElementById("totalCost").textContent = filtrados.reduce((sum, p) => sum + p.costo*p.cantidad, 0).toLocaleString();
  const table = document.getElementById("inventarioTable");
  table.innerHTML = `
    <thead>
      <tr>
        <th>Producto</th><th>Costo</th><th>Precio</th><th>Cantidad</th><th>Ganancia</th><th>En Rutas</th>
      </tr>
    </thead>
    <tbody>
      ${filtrados.map(p => `
        <tr>
          <td>${p.nombre}</td>
          <td>$${p.costo.toLocaleString()}</td>
          <td>$${p.precio.toLocaleString()}</td>
          <td>${p.cantidad}</td>
          <td>$${p.ganancia.toLocaleString()}</td>
          <td>${p.enRutas}</td>
        </tr>`).join('')}
    </tbody>`;
}

function renderRutas() {
  const rutaSelect = document.getElementById("rutaSelect");
  rutaSelect.innerHTML = rutas.map((r, i) => `<option value="${i}">${r.nombre}</option>`).join('');
  const productoRutaSelect = document.getElementById("productoRutaSelect");
  productoRutaSelect.innerHTML = productos.map((p, i) => `<option value="${i}">${p.nombre}</option>`).join('');
  renderRutasTable();
}

document.getElementById("asignarRutaBtn").addEventListener("click", () => {
  const rutaIndex = document.getElementById("rutaSelect").value;
  const prodIndex = document.getElementById("productoRutaSelect").value;
  const cantidad = parseInt(document.getElementById("cantidadRutaInput").value);
  if (cantidad > 0 && productos[prodIndex].cantidad >= cantidad) {
    productos[prodIndex].cantidad -= cantidad;
    productos[prodIndex].enRutas += cantidad;
    const fecha = new Date().toLocaleString();
    rutas[rutaIndex].salidas.push({producto: productos[prodIndex].nombre, cantidad, fecha});
    ventas.push({producto: productos[prodIndex].nombre, cantidad, fecha});
    guardarEstado();
    renderInventario(); renderRutas(); renderVentas();
    document.getElementById("cantidadRutaInput").value = "";
  } else {
    alert("Cantidad inválida o stock insuficiente");
  }
});

function renderRutasTable() {
  const rutasTable = document.getElementById("rutasTable");
  rutasTable.innerHTML = `
    <thead>
      <tr><th>Ruta</th><th>Producto</th><th>Cantidad</th><th>Fecha</th></tr>
    </thead>
    <tbody>
      ${rutas.flatMap(r => r.salidas.map(s => `
        <tr>
          <td>${r.nombre}</td>
          <td>${s.producto}</td>
          <td>${s.cantidad}</td>
          <td>${s.fecha}</td>
        </tr>`)).join('')}
    </tbody>`;
}

function renderVentas() {
  const ventasTable = document.getElementById("ventasTable");
  ventasTable.innerHTML = `
    <thead>
      <tr><th>Producto</th><th>Cantidad</th><th>Fecha</th></tr>
    </thead>
    <tbody>
      ${ventas.map(v => `
        <tr>
          <td>${v.producto}</td>
          <td>${v.cantidad}</td>
          <td>${v.fecha}</td>
        </tr>`).join('')}
    </tbody>`;
}

renderInventario();
  </script>
</body>
</html>
