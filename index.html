<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRONA SUR - Inventario</title>
  <style>
    :root {
      --verde-prona: #2e7d32;
      --verde-claro: #66bb6a;
      --blanco: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--blanco);
      display: flex;
      height: 100vh;
    }

    aside {
      width: 250px;
      background-color: var(--verde-prona);
      color: var(--blanco);
      padding: 20px;
      box-sizing: border-box;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }

    nav a {
      display: block;
      color: var(--blanco);
      text-decoration: none;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 5px;
      cursor: pointer;
    }

    nav a:hover, nav a.active {
      background-color: #27642b;
    }

    main {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }

    h2 {
      color: var(--verde-prona);
    }

    .hidden {
      display: none;
    }

    button {
      background-color: var(--verde-claro);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px 0;
    }

    button:hover {
      background-color: #57a05b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: var(--verde-claro);
      color: white;
    }

    input, select {
      padding: 6px;
      margin: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .total-costo {
      font-weight: bold;
      color: var(--verde-prona);
      font-size: 18px;
      margin-top: 10px;
    }

    .image-preview {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }

    .dynamic-routes {
      margin-top: 15px;
    }

    .route-item {
      background-color: #e8f5e9;
      padding: 6px;
      border-radius: 4px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-item button {
      background-color: #c62828;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <aside>
    <div class="logo">PRONA SUR</div>
    <nav>
      <a id="inventarioLink" class="active">📦 Inventario</a>
      <a id="gestionarRutasLink">🛣️ Gestionar Rutas</a>
    </nav>
  </aside>

  <main>
    <section id="inventarioSection">
      <h2>Inventario</h2>
      <div id="inventarioContainer"></div>
    </section>

    <section id="gestionarRutasSection" class="hidden">
      <h2>Gestionar Rutas</h2>
      <input id="nuevaRutaInput" placeholder="Nombre de la nueva ruta">
      <button onclick="agregarRuta()">Agregar Ruta</button>
      <div class="dynamic-routes" id="listaRutas"></div>
    </section>
<script>
      let productos = JSON.parse(localStorage.getItem('productos')) || [];
      let rutas = JSON.parse(localStorage.getItem('rutas')) || [];

      const inventarioLink = document.getElementById('inventarioLink');
      const gestionarRutasLink = document.getElementById('gestionarRutasLink');
      const inventarioSection = document.getElementById('inventarioSection');
      const gestionarRutasSection = document.getElementById('gestionarRutasSection');
      const inventarioContainer = document.getElementById('inventarioContainer');

      // Navegación
      inventarioLink.addEventListener('click', () => {
        inventarioLink.classList.add('active');
        gestionarRutasLink.classList.remove('active');
        inventarioSection.classList.remove('hidden');
        gestionarRutasSection.classList.add('hidden');
        renderInventario();
      });

      gestionarRutasLink.addEventListener('click', () => {
        inventarioLink.classList.remove('active');
        gestionarRutasLink.classList.add('active');
        inventarioSection.classList.add('hidden');
        gestionarRutasSection.classList.remove('hidden');
        renderRutas();
      });

      // Render Inventario
      function renderInventario() {
        let costoTotal = productos.reduce((sum, p) => sum + (p.costo * p.cantidad), 0);
        inventarioContainer.innerHTML = `
          <button onclick="abrirFormulario()">➕ Agregar Producto</button>
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nombre/Referencia</th>
                <th>Costo</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Ganancia</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${productos.map((p, i) => `
                <tr>
                  <td><img src="${p.foto}" class="image-preview"></td>
                  <td>${p.nombre}</td>
                  <td>$${p.costo}</td>
                  <td>$${p.precio}</td>
                  <td>${p.cantidad}</td>
                  <td>$${p.ganancia}</td>
                  <td>
                    <button onclick="editarProducto(${i})">✏️</button>
                    <button onclick="eliminarProducto(${i})">🗑️</button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div class="total-costo">Costo total del inventario: $${costoTotal}</div>
          <div id="formulario"></div>
        `;
      }

      // Formulario agregar
      function abrirFormulario() {
        document.getElementById('formulario').innerHTML = `
          <h4>Nuevo Producto</h4>
          <input type="file" id="nuevaFoto" accept="image/*">
          <input placeholder="Nombre o referencia" id="nuevoNombre">
          <input type="number" placeholder="Cantidad" id="nuevaCantidad">
          <input type="number" placeholder="Costo" id="nuevoCosto">
          <input type="number" placeholder="Precio" id="nuevoPrecio">
          <input type="number" placeholder="Ganancia" id="nuevaGanancia">
          <button onclick="guardarNuevo()">Guardar</button>
        `;
      }

      function guardarNuevo() {
        const fileInput = document.getElementById('nuevaFoto');
        const reader = new FileReader();
        reader.onload = function (e) {
          const fotoBase64 = e.target.result;
          const nombre = document.getElementById('nuevoNombre').value.trim();
          const cantidad = parseInt(document.getElementById('nuevaCantidad').value);
          const costo = parseInt(document.getElementById('nuevoCosto').value);
          const precio = parseInt(document.getElementById('nuevoPrecio').value);
          const ganancia = parseInt(document.getElementById('nuevaGanancia').value);

          const existente = productos.find(p => p.nombre.toLowerCase() === nombre.toLowerCase());
          if (existente) {
            existente.cantidad += cantidad;
          } else {
            productos.push({ foto: fotoBase64, nombre, cantidad, costo, precio, ganancia });
          }
          guardar();
          renderInventario();
        };

        if (fileInput.files[0]) {
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          alert("Por favor selecciona una foto");
        }
      }

      // Editar producto
      function editarProducto(i) {
        const p = productos[i];
        document.getElementById('formulario').innerHTML = `
          <h4>Editar Producto</h4>
          <input type="file" id="editFoto" accept="image/*">
          <input value="${p.nombre}" id="editNombre">
          <input type="number" value="${p.cantidad}" id="editCantidad">
          <input type="number" value="${p.costo}" id="editCosto">
          <input type="number" value="${p.precio}" id="editPrecio">
          <input type="number" value="${p.ganancia}" id="editGanancia">
          <button onclick="guardarEdicion(${i})">Guardar Cambios</button>
        `;
      }

      function guardarEdicion(i) {
        const p = productos[i];
        const fileInput = document.getElementById('editFoto');
        const nombre = document.getElementById('editNombre').value.trim();
        const cantidad = parseInt(document.getElementById('editCantidad').value);
        const costo = parseInt(document.getElementById('editCosto').value);
        const precio = parseInt(document.getElementById('editPrecio').value);
        const ganancia = parseInt(document.getElementById('editGanancia').value);

        p.nombre = nombre;
        p.cantidad = cantidad;
        p.costo = costo;
        p.precio = precio;
        p.ganancia = ganancia;

        if (fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            p.foto = e.target.result;
            guardar();
            renderInventario();
          };
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          guardar();
          renderInventario();
        }
      }

      // Eliminar producto
      function eliminarProducto(i) {
        if (confirm("¿Eliminar producto?")) {
          productos.splice(i, 1);
          guardar();
          renderInventario();
        }
      }

      // LocalStorage
      function guardar() {
        localStorage.setItem('productos', JSON.stringify(productos));
        localStorage.setItem('rutas', JSON.stringify(rutas));
      }

      // Gestión dinámica de rutas
      function renderRutas() {
        const lista = document.getElementById('listaRutas');
        lista.innerHTML = rutas.map((ruta, i) => `
          <div class="route-item">
            <span>${ruta}</span>
            <button onclick="eliminarRuta(${i})">Eliminar</button>
          </div>
        `).join('');
      }

      function agregarRuta() {
        const nuevaRuta = document.getElementById('nuevaRutaInput').value.trim();
        if (nuevaRuta && !rutas.includes(nuevaRuta)) {
          rutas.push(nuevaRuta);
          guardar();
          renderRutas();
          document.getElementById('nuevaRutaInput').value = '';
        }
      }

      function eliminarRuta(i) {
        if (confirm("¿Eliminar esta ruta?")) {
          rutas.splice(i, 1);
          guardar();
          renderRutas();
        }
      }

      // Inicial
      renderInventario();
    </script>
  </body>
</html>
